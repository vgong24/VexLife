name: Foundation checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Source, blueprint, and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Report runtime
        run: node --version

      - name: Ground bounded repository orientation
        env:
          VEXLIFE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          VEXLIFE_PR_NUMBER: ${{ github.event.pull_request.number }}
          VEXLIFE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npm run orient

      - name: Run the complete foundation gate
        run: npm run pr-ready

      - name: Verify executed current health receipt
        run: npm run health:check

      - name: Reconfirm the canonical source manifest
        run: npm run manifest:check
