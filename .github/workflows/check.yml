name: Foundation checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number when manually validating an active PR head
        required: false
        type: string
      base_sha:
        description: Exact base SHA for manual active-PR validation
        required: false
        type: string
      work_ref:
        description: Exact source-managed workRef for manual active-PR validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Source, blueprint, and actual browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VEXLIFE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      VEXLIFE_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      VEXLIFE_WORK_REF: ${{ inputs.work_ref || '' }}
      VEXLIFE_BRANCH: ${{ github.head_ref || github.ref_name }}
      VEXLIFE_CURRENT_WORK_EVENT_NAME: ${{ github.event_name }}
      VEXLIFE_CURRENT_WORK_EVENT_PATH: ${{ github.event_path }}
      VEXLIFE_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VEXLIFE_TESTED_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      VEXLIFE_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Report runtime
        run: node --version

      - name: Install declared dependencies
        run: npm ci

      - name: Install deterministic Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Materialize exact candidate source manifest
        run: npm run manifest:write

      - name: Ground bounded repository orientation
        run: npm run orient

      - name: Run the real disposable Build Admission proof once
        run: npm run build-admission:check

      - name: Run the complete foundation gate from the retained exact receipt
        run: npm run pr-ready

      - name: Verify Health independently consumes the same exact receipt
        run: npm run health:check

      - name: Preserve exact browser, effect, health, and manifest receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vexlife-exact-check-receipts
          path: |
            SOURCE-MANIFEST.json
            source-manifest-parts/*.json
            generated/health/browser-integration.json
            generated/health/build-admission-simulation.json
            generated/health/build-admission-pr_ready-consumption.json
            generated/health/build-admission-health-consumption.json
            generated/health/continuity-evolution-simulation.json
            generated/health/intent-scheduler-simulation.json
            generated/health/runtime-recovery-simulation.json
            generated/health/pr-ready.json
          if-no-files-found: error

      - name: Reconfirm the canonical source manifest
        run: npm run --silent manifest:check

  manifest-portability:
    name: Source manifest portability (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            name: Linux
            runner: ubuntu-latest
          - id: windows
            name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12

    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install declared dependencies
        shell: bash
        run: npm ci

      - name: Materialize exact candidate source manifest
        shell: bash
        run: npm run manifest:write

      - name: Run complete bounded real-effect and adversarial host proof
        shell: bash
        run: npm run build-admission:host-proof -- --expected-platform ${{ matrix.id }} --receipt generated/health/build-admission-host-proof-${{ matrix.id }}.json

      - name: Verify and preserve canonical manifest receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          MATRIX_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          npm run --silent manifest:check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const descriptor = JSON.parse(fs.readFileSync('SOURCE-MANIFEST.json', 'utf8'));
          const checkedOutHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const receipt = {
            schemaVersion: 'vexlife.source-manifest-portability-receipt/v1',
            state: checkedOutHead === process.env.EXPECTED_HEAD ? 'PASS' : 'FAILED',
            currentness: checkedOutHead === process.env.EXPECTED_HEAD ? 'CURRENT' : 'BLOCKED',
            command: 'npm run --silent manifest:check',
            runnerOs: process.env.RUNNER_OS_VALUE,
            runnerArchitecture: process.env.RUNNER_ARCH_VALUE,
            candidateHeadSha: process.env.EXPECTED_HEAD,
            checkedOutHeadSha: checkedOutHead,
            baseSha: process.env.BASE_SHA,
            manifestSchemaVersion: descriptor.schemaVersion,
            sourceRecordSchemaVersion: descriptor.sourceRecordSchemaVersion,
            partSchemaVersion: descriptor.partSchemaVersion,
            manifestState: 'SOURCE_MANIFEST_CURRENT',
            candidateState: 'CURRENT',
            treeSha256: descriptor.treeSha256,
            contractSha256: descriptor.contractSha256,
            pathDifferences: [],
            exitCode: 0,
            powerShellUsed: false
          };
          fs.mkdirSync('generated/health', { recursive: true });
          fs.writeFileSync(`generated/health/source-manifest-portability-${process.env.MATRIX_ID}.json`, `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(receipt, null, 2));
          if (receipt.state !== 'PASS') process.exit(1);
          NODE

      - name: Preserve exact portability and host proof receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vexlife-source-manifest-portability-${{ matrix.id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            generated/health/source-manifest-portability-${{ matrix.id }}.json
            generated/health/build-admission-host-proof-${{ matrix.id }}.json
            generated/health/build-admission-host-integrated-${{ matrix.id }}.json
          if-no-files-found: error

  g01-lived-companion-windows:
    name: G01 lived companion Windows restart and resume proof
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm ci

      - name: Run actual loopback turn, shutdown, and fresh-process resume proof
        shell: pwsh
        env:
          VEXLIFE_G01_PROOF_HOME: ${{ runner.temp }}/vexlife-g01-proof-home
          VEXLIFE_G01_PROOF_RECEIPT: generated/health/g01-lived-companion-windows-proof.json
          VEXLIFE_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run lived-companion:proof

      - name: Preserve exact G01 Windows proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vexlife-g01-lived-companion-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: generated/health/g01-lived-companion-windows-proof.json
          if-no-files-found: error


  g02-score-context-windows:
    name: G02 Score and context continuity Windows proof
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm ci

      - name: Run Score relation, correction, tail, source-descent and fresh-process proof
        shell: pwsh
        env:
          VEXLIFE_G02_PROOF_HOME: ${{ runner.temp }}/vexlife-g02-proof-home
          VEXLIFE_G02_PROOF_RECEIPT: generated/health/score-context-continuity-proof.json
          VEXLIFE_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run score-context:proof

      - name: Preserve exact G02 Windows proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vexlife-g02-score-context-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: generated/health/score-context-continuity-proof.json
          if-no-files-found: error


  g03-daily-memory-dream-windows:
    name: G03 Daily Memory-Only Dream Windows proof
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm ci

      - name: Run exact G03 memory-only Daily Stratum, crash and wake proof
        shell: pwsh
        env:
          VEXLIFE_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run daily-memory-dream:proof

      - name: Preserve exact G03 Windows proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vexlife-g03-daily-memory-dream-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: generated/health/g03-daily-memory-dream-proof.json
          if-no-files-found: error



  g04-evaluated-rhythm-learning-windows:
    name: G04 Evaluated Rhythm Learning Windows proof
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm ci

      - name: Run exact G04 inactive faithful simulated Rhythm proof
        shell: pwsh
        env:
          VEXLIFE_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run evaluated-rhythm-learning:proof

      - name: Preserve exact G04 Windows proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vexlife-g04-evaluated-rhythm-learning-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: generated/health/g04-evaluated-rhythm-learning-proof.json
          if-no-files-found: error


  g05a-scheduled-daily-autonomy-windows:
    name: G05A scheduled daily autonomy Windows proof
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm ci

      - name: Run exact G05A deterministic scheduled-autonomy proof
        shell: pwsh
        env:
          VEXLIFE_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VEXLIFE_G05A_PROOF_RECEIPT: generated/health/g05a-scheduled-daily-autonomy-windows-proof.json
        run: npm run scheduled-daily-autonomy:proof

      - name: Preserve exact G05A Windows proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vexlife-g05a-scheduled-daily-autonomy-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: generated/health/g05a-scheduled-daily-autonomy-windows-proof.json
          if-no-files-found: error
