name: Plugin Foundation One-Shot Correction

on:
  push:
    branches:
      - VXG-080426-chatgpt-vexlife-plugin-process-runtime-foundation

permissions:
  contents: write

jobs:
  apply-verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Decode and verify exact correction
        run: |
          base64 -d .github/foundation-correction.patch.gz.b64 | gzip -dc > /tmp/foundation-correction.patch
          git apply --check --exclude=.github/workflows/plugin-foundation-manifest.yml /tmp/foundation-correction.patch
      - name: Apply correction and remove temporary machinery
        run: |
          git apply --exclude=.github/workflows/plugin-foundation-manifest.yml /tmp/foundation-correction.patch
          rm .github/foundation-correction.patch.gz.b64
          rm .github/workflows/plugin-foundation-manifest.yml
      - run: npm run manifest:write
      - run: npm run check
      - name: Prove fresh Root cold start
        run: npm run root:process -- --packet test/fixtures/root-process/fresh-root-packet.json
      - name: Commit only the verified durable foundation
        run: |
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git add -A
          git diff --cached --check
          git commit -s -m "Derive Process Factory authority for reusable plugins"
          git push origin HEAD:VXG-080426-chatgpt-vexlife-plugin-process-runtime-foundation
