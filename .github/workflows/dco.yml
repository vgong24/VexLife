name: DCO

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify every pull-request commit
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          remote_base_ref="refs/remotes/origin/${BASE_REF}"
          if ! git rev-parse --verify --quiet "${remote_base_ref}^{commit}" >/dev/null; then
            echo "::error::Current pull-request base ref is unavailable: ${remote_base_ref}"
            exit 1
          fi

          current_base_sha="$(git rev-parse "${remote_base_ref}^{commit}")"
          base_sha="$(git merge-base "${current_base_sha}" "${HEAD_SHA}")"
          echo "DCO range merge-base=${base_sha} currentBase=${current_base_sha} eventBase=${EVENT_BASE_SHA} head=${HEAD_SHA}"

          failures=0
          commit_count=0

          while IFS= read -r commit_sha; do
            if [[ -z "${commit_sha}" ]]; then
              continue
            fi

            commit_count=$((commit_count + 1))
            author_name="$(git show -s --format=%an "${commit_sha}")"
            author_email="$(git show -s --format=%ae "${commit_sha}")"
            expected_signoff="Signed-off-by: ${author_name} <${author_email}>"

            if git show -s --format=%B "${commit_sha}" |
              grep -Fxiq -- "${expected_signoff}"; then
              continue
            fi

            read -r -a parents <<< "$(git show -s --format=%P "${commit_sha}")"
            if [[ "${#parents[@]}" -eq 2 ]]; then
              actual_tree="$(git show -s --format=%T "${commit_sha}")"
              if expected_tree="$(git merge-tree --write-tree "${parents[0]}" "${parents[1]}")" &&
                [[ "${expected_tree}" =~ ^[0-9a-f]{40,64}$ ]] &&
                [[ "${actual_tree}" == "${expected_tree}" ]]; then
                echo "Accepted exact mechanical merge ${commit_sha}; both parent histories remain independently checked."
                continue
              fi
            fi

            echo "::error::Missing author-matching DCO sign-off on ${commit_sha}: expected '${expected_signoff}'"
            failures=$((failures + 1))
          done < <(git rev-list --reverse "${base_sha}..${HEAD_SHA}")

          if [[ "${commit_count}" -eq 0 ]]; then
            echo "::error::No pull-request commits were found in ${base_sha}..${HEAD_SHA}"
            exit 1
          fi

          if [[ "${failures}" -ne 0 ]]; then
            echo "${failures} commit(s) failed the DCO 1.1 sign-off check."
            exit 1
          fi

          echo "All ${commit_count} pull-request commit(s) carry author-matching sign-off or are exact content-neutral mechanical merges."
