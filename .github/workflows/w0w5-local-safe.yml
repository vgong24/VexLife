name: Windows W0-W5 Clean Semantic Head
on:
  push:
    branches:
      - VXG-080426-chatgpt-vexlife-plugin-process-runtime-foundation
permissions:
  contents: write
  issues: write
concurrency:
  group: windows-w0-w5-clean-semantic-head
  cancel-in-progress: false
jobs:
  restore-verify-return:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct, verify, clean, commit, push and return
        env:
          GH_TOKEN: ${{ github.token }}
        run: cat .github/w0w5-object/run.* > /tmp/w0w5-run.sh && bash /tmp/w0w5-run.sh
