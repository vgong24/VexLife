name: Root PR 351 ready transition

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    if: >-
      github.repository == 'vgong24/VexLife' &&
      github.event.pull_request.number == 351 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'VXG-083126-coder-vexlife-android-remote-vessel-reference'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark exact same-repository PR ready and verify binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          payload="$(jq -nc --arg id "$PR_NODE_ID" '{
            query: "mutation MarkReady($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { number isDraft } } }",
            variables: { id: $id }
          }')"

          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            https://api.github.com/graphql \
            --data "$payload")"

          jq -e '.errors == null and (.data.markPullRequestReadyForReview.pullRequest | .number == 351 and .isDraft == false)' \
            <<<"$response" >/dev/null

          current="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vgong24/VexLife/pulls/351)"

          jq -e \
            --arg head "$EXPECTED_HEAD_SHA" \
            --arg branch "$EXPECTED_BRANCH" \
            '.draft == false and .state == "open" and .merged == false and .head.sha == $head and .head.ref == $branch and .base.ref == "main"' \
            <<<"$current" >/dev/null

          jq -n \
            --arg head "$EXPECTED_HEAD_SHA" \
            --arg branch "$EXPECTED_BRANCH" \
            '{
              schemaVersion: "vexlife.root-ready-transition/v1",
              state: "PASS",
              currentness: "CURRENT",
              pullRequest: 351,
              draft: false,
              headSha: $head,
              branch: $branch,
              authorizedEffect: "MARK_READY",
              productEffectsExecuted: false
            }'

# [VXG RealForever]
