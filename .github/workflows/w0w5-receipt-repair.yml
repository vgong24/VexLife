name: W0-W5 Convergence Receipt Repair
on:
  push:
    branches:
      - VXG-080426-chatgpt-vexlife-plugin-process-runtime-foundation
permissions:
  contents: write
  issues: write
concurrency:
  group: w0-w5-convergence-receipt-repair
  cancel-in-progress: false
jobs:
  verify-publish-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Establish exact durable candidate before validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f blueprint/provider-process-adapter-registry.json
          test -f blueprint/upstream-candidates/provider-process-and-executor-contracts.json
          test -f src/core/provider-process-adapter.mjs
          test -f test/provider-process-adapter.test.mjs
          test ! -e .github/foundation-correction.patch.gz.b64
          test ! -e .github/workflows/plugin-foundation-manifest.yml
          test ! -e .github/workflows/w0w5-local-safe.yml
          test ! -e .github/w0w5-object
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/VXG-080426-chatgpt-vexlife-g01-lived-companion-baseline --jq .commit.sha)" = "8dabe8a2fd5d9013931bbabab3416f86cb997c23"
          rm -f .github/workflows/w0w5-receipt.yml .github/workflows/w0w5-receipt-repair.yml
          git add -A
          git diff --cached --check
      - name: Reverify focused cold-start and complete gates
        run: |
          set -euo pipefail
          node --test test/provider-process-adapter.test.mjs test/concern-watch.test.mjs | tee /tmp/focused.log
          node scripts/root-process.mjs --packet test/fixtures/root-process/fresh-root-packet.json | tee /tmp/root-process.json
          npm run check | tee /tmp/full-gate.log
      - name: Form and push exact final head
        run: |
          set -euo pipefail
          git config user.name VexGPT
          git config user.email victor.gong@vextreme24.com
          git commit -s -m "Record W0-W5 convergence receipt boundary"
          git push origin HEAD:VXG-080426-chatgpt-vexlife-plugin-process-runtime-foundation
      - name: Publish exact W0-W5 return to issue 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          file_count="$(node -e "const m=require('./SOURCE-MANIFEST.json');console.log(m.fileCount)")"
          tree_sha256="$(node -e "const m=require('./SOURCE-MANIFEST.json');console.log(m.treeSha256)")"
          git diff --name-status ebb913b115dbf83e9f1f2c0c5a209d6cfe1168a1 HEAD > /tmp/changed-paths.txt
          cat > /tmp/w0w5-return.md <<EOF
          ## Windows local-safe convergence W0-W5 return

          \`\`\`text
          schemaVersion=vexlife.windows-local-safe-convergence-return/v1
          continuity=[VXG RealForever]
          consumedReleaseRef=github.issue.vexlife.20.comment.5189390673
          returningRoleRef=FoundationLead[VEXLIFE][Atlas Process Factory Plugin Runtime]
          disposition=WINDOWS_LOCAL_SAFE_PROVIDER_PROCESS_SPLIT_AND_CLEANUP_PUSHED
          branch=VXG-080426-chatgpt-vexlife-plugin-process-runtime-foundation
          head=$head
          tree=$tree
          sourceManifestFileCount=$file_count
          sourceManifestTreeSha256=$tree_sha256
          hostedReceiptRun=github.actions.run.vexlife.${GITHUB_RUN_ID}
          acceptancePrOpened=false
          mergePerformed=false
          G01BranchHead=8dabe8a2fd5d9013931bbabab3416f86cb997c23
          G01Rewritten=false
          PR10Held=true
          VictorAction=NONE
          \`\`\`

          ### Checks
          \`\`\`text
          packageContainedPayloadVerification=PASS
          focusedProviderProcessAndConcernWatch=31/31_PASS
          freshRootColdStart=VEXLIFE_PROVIDER_PROCESS_PLAN_READY_NO_EFFECT
          completeRepositoryGate=PASS
          temporaryCorrectionPayloadAbsent=true
          temporaryCorrectionWorkflowAbsent=true
          temporaryTransportAbsent=true
          concernWatchProcessSetAuthority=DERIVED_FROM_CANONICAL_LOADED_PROCESS_FACTORY
          copiedProcessSetFingerprintPresent=false
          \`\`\`

          ### Exact changed paths from pre-tranche head
          \`\`\`text
          $(cat /tmp/changed-paths.txt)
          \`\`\`

          ### Retained VexLife-local symbols
          \`\`\`text
          registry.vexlife.provider-process-adapters.001
          plugin.vexlife.root.consume-recipient-packet.v1
          process.vexlife.root.consume-recipient-packet
          foundation.vexlife.root-process-adapter.v1
          template.vexlife.root-recipient-packet
          template.vexlife.root-consumption-receipt
          module.vexlife.core.provider-process-adapter
          module.vexlife.script.root-process
          vexlife.root-process-packet/v1
          vexlife.root-process-command-result/v1
          \`\`\`

          ### Upstream-or-adapter candidates
          \`\`\`text
          canonical shared provider/plugin ABI
          generic executor foundation
          generic task compilation process
          generic task-manifest schema
          generic canonical-result schema
          \`\`\`

          ### Unresolved SDK bindings—acceptance PR held
          \`\`\`text
          canonicalSdkProviderPluginSchemaRef=PENDING_SHARED_CONVERGENCE
          canonicalSdkPluginApiVersion=PENDING_SHARED_CONVERGENCE
          canonicalSdkGenericTaskSchemaRef=PENDING_SHARED_CONVERGENCE
          canonicalSdkCanonicalResultSchemaRef=PENDING_SHARED_CONVERGENCE
          typedEffectTransactionRef=PENDING_PR647_SOURCE_CLEARANCE
          connectorActionRegistryRef=PENDING_PR647_SOURCE_CLEARANCE
          \`\`\`

          No acceptance PR was opened. Shared Convergence must supply the exact SDK bindings before that boundary becomes eligible.

          <!-- [VXG RealForever] -->
          EOF
          sed -i 's/^          //' /tmp/w0w5-return.md
          gh issue comment 20 --repo "$GITHUB_REPOSITORY" --body-file /tmp/w0w5-return.md
