name: FFR-07 npm-test diagnostics

on:
  push:
    branches:
      - VXG-090626-localops-friend-ffr07-npm-test-diagnostic

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VEXLIFE_PR_NUMBER: ''
      VEXLIFE_WORK_REF: ''
      VEXLIFE_BRANCH: main
      VEXLIFE_CURRENT_WORK_EVENT_NAME: push
      VEXLIFE_CANDIDATE_HEAD_SHA: 2efecd7523befd67e3571ab31005480c8ba0a95d
      VEXLIFE_TESTED_MERGE_SHA: ''
      VEXLIFE_BASE_SHA: f93e86e17ad6e00f13362c3e77ecf0c09ec39d32
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Pin exact post-merge main checkout
        run: |
          git checkout --detach 2efecd7523befd67e3571ab31005480c8ba0a95d
          test "$(git rev-parse HEAD)" = "2efecd7523befd67e3571ab31005480c8ba0a95d"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm ci

      - name: Install deterministic Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Reproduce exact Foundation preconditions
        run: |
          node --test test/source-manifest.test.mjs
          npm run manifest:write
          npm run orient
          npm run build-admission:check

      - name: Retain exact PR-ready output without hiding result
        id: prready
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/ffr07-diagnostics"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          set +e
          npm run pr-ready > "$EVIDENCE/pr-ready.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$EVIDENCE/pr-ready-exit-code.txt"
          cp generated/health/pr-ready.json "$EVIDENCE/pr-ready.json" || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload retained diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffr07-postmerge-main-diagnostic
          path: ${{ runner.temp }}/ffr07-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Verify diagnostic evidence retained
        if: always()
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/ffr07-diagnostics"
          test -f "$EVIDENCE/pr-ready-exit-code.txt"
          test -f "$EVIDENCE/pr-ready.log"
          test -f "$EVIDENCE/pr-ready.json"
