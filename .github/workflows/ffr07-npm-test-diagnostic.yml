name: FFR-07 npm-test diagnostics

on:
  push:
    branches:
      - VXG-090626-localops-friend-ffr07-npm-test-diagnostic

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Pin exact accepted-main checkout
        run: |
          git checkout --detach 2efecd7523befd67e3571ab31005480c8ba0a95d
          test "$(git rev-parse HEAD)" = "2efecd7523befd67e3571ab31005480c8ba0a95d"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm ci

      - name: Install deterministic Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Reproduce exact Foundation preconditions
        run: |
          node --test test/source-manifest.test.mjs
          npm run manifest:write
          npm run orient
          npm run build-admission:check

      - name: Capture bounded npm-test reproduction evidence
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/ffr07-npm-test-reproduction"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          printf '%s\n' '2efecd7523befd67e3571ab31005480c8ba0a95d' > "$EVIDENCE/tested-main-sha.txt"
          printf '%s\n' "$(node --version)" > "$EVIDENCE/node-version.txt"
          captured=0
          attempts=0
          for attempt in 1 2 3 4 5; do
            attempts=$attempt
            set +e
            npm test > "$EVIDENCE/npm-test-attempt-$attempt.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$EVIDENCE/npm-test-attempt-$attempt.exit-code.txt"
            if [ "$code" -ne 0 ]; then
              captured=1
              break
            fi
          done
          printf '%s\n' "$attempts" > "$EVIDENCE/attempt-count.txt"
          printf '%s\n' "$captured" > "$EVIDENCE/failure-captured.txt"
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE/git-status-after-tests.txt"

      - name: Upload retained reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffr07-postmerge-npm-test-reproduction
          path: ${{ runner.temp }}/ffr07-npm-test-reproduction/
          if-no-files-found: error
          retention-days: 7

      - name: Verify diagnostic evidence retained
        if: always()
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/ffr07-npm-test-reproduction"
          test -f "$EVIDENCE/tested-main-sha.txt"
          test -f "$EVIDENCE/attempt-count.txt"
          test -f "$EVIDENCE/failure-captured.txt"
          test -f "$EVIDENCE/npm-test-attempt-1.log"
